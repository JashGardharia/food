<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriVision</title>

<link rel="icon" type="image/png" href="favicon.png">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
overflow-x:hidden;color:white;min-height:100vh;
background:#081c15;
}
.bg{
position:fixed;inset:0;z-index:-2;
background:
radial-gradient(circle at 20% 20%, #52b788 0%, transparent 30%),
radial-gradient(circle at 80% 30%, #95d5b2 0%, transparent 30%),
radial-gradient(circle at 50% 80%, #40916c 0%, transparent 35%),
#081c15;
animation:bgMove 12s ease-in-out infinite alternate;
}
@keyframes bgMove{
from{transform:scale(1) rotate(0deg)}
to{transform:scale(1.1) rotate(3deg)}
}
.float{
position:fixed;font-size:52px;opacity:.22;pointer-events:none;
animation:float 8s ease-in-out infinite;
}
.f1{left:8%;top:12%}
.f2{right:8%;top:20%;animation-delay:2s}
.f3{left:12%;bottom:15%;animation-delay:4s}
.f4{right:12%;bottom:18%;animation-delay:1s}
.f5{left:50%;top:8%;animation-delay:3s}
@keyframes float{
50%{transform:translateY(-30px) rotate(10deg)}
}

.container{max-width:1200px;margin:auto;padding:30px}
.hero{text-align:center;padding:40px 0}
.hero h1{font-size:4rem}
.hero p{opacity:.9;margin-top:10px}

.glass{
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.main{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.card{padding:25px;transition:.4s}
.card:hover{transform:translateY(-8px) rotateX(2deg) rotateY(-2deg)}

#webcam-container{
display:flex;justify-content:center;margin-top:15px
}
canvas{
border-radius:25px;
border:3px solid rgba(255,255,255,.2);
box-shadow:0 0 40px rgba(34,197,94,.35);
max-width:100%;
}

button{
width:100%;margin-top:20px;padding:16px;border:none;
border-radius:16px;font-size:1rem;font-weight:700;
background:#22c55e;color:white;cursor:pointer;
}
button:hover{transform:scale(1.02)}

.result{
padding:20px;border-radius:20px;text-align:center;
margin-bottom:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;margin-top:25px;
}
.stat{padding:20px;text-align:center}
.num{font-size:2rem;font-weight:bold}

.bar{
height:22px;background:rgba(255,255,255,.15);
border-radius:999px;overflow:hidden;margin:10px 0;
}
.fill{height:100%;width:0%;transition:.5s}

.healthyGlow{
animation:glow 2s infinite;
}
@keyframes glow{
50%{box-shadow:0 0 40px rgba(34,197,94,.8)}
}

@media(max-width:900px){
.main{grid-template-columns:1fr}
.stats{grid-template-columns:repeat(2,1fr)}
.hero h1{font-size:2.6rem}
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="float f1">🍎</div>
<div class="float f2">🥑</div>
<div class="float f3">🥕</div>
<div class="float f4">🍇</div>
<div class="float f5">🍊</div>

<div class="container">

<div class="hero">
<h1>🥗 Healthy vs Unhealthy 🍔</h1>
<p>Food Classification Model Using Machine Learning</p>
</div>

<div class="main">

<div class="glass card">
<h2>📷 Live Detection</h2>
<div id="webcam-container"></div>
<button onclick="init()">Start Scanner</button>
</div>

<div class="glass card">
<div id="result" class="result">
<h2>Waiting for Camera...</h2>
<p>Start detection to analyze food.</p>
</div>
<div id="label-container"></div>
</div>

</div>

<div class="stats">
<div class="glass stat"><div class="num counter" data-target="6500">0</div>Total Images</div>
<div class="glass stat"><div class="num counter" data-target="2500">0</div>Healthy</div>
<div class="glass stat"><div class="num counter" data-target="4000">0</div>Unhealthy</div>
<div class="glass stat"><div class="num">Model</div>Teachable Machine ™</div>
</div>

</div>

<script>
document.querySelectorAll(".counter").forEach(c=>{
let target=+c.dataset.target;
let count=0;
let step=Math.ceil(target/100);
let i=setInterval(()=>{
count+=step;
if(count>=target){count=target;clearInterval(i);}
c.textContent=count.toLocaleString();
},20);
});

const URL="./model/";
let model, webcam, maxPredictions, labelContainer;

async function init(){
const modelURL=URL+"model.json";
const metadataURL=URL+"metadata.json";

model=await tmImage.load(modelURL,metadataURL);
maxPredictions=model.getTotalClasses();

webcam=new tmImage.Webcam(400,400,true);
await webcam.setup();
await webcam.play();

document.getElementById("webcam-container").innerHTML="";
document.getElementById("webcam-container").appendChild(webcam.canvas);

labelContainer=document.getElementById("label-container");
labelContainer.innerHTML="";
for(let i=0;i<maxPredictions;i++){
labelContainer.appendChild(document.createElement("div"));
}

window.requestAnimationFrame(loop);
}

async function loop(){
webcam.update();
await predict();
window.requestAnimationFrame(loop);
}

async function predict(){
const prediction=await model.predict(webcam.canvas);

let best=prediction[0];
prediction.forEach(p=>{
if(p.probability>best.probability) best=p;
});

const conf=(best.probability*100).toFixed(1);
const res=document.getElementById("result");

if(best.className.toLowerCase().includes("healthy")){
res.className="result healthyGlow";
res.style.background="rgba(34,197,94,.25)";
res.innerHTML=`<h2>✅ HEALTHY FOOD</h2><p>Confidence: ${conf}%</p>`;
}else{
res.className="result";
res.style.background="rgba(239,68,68,.25)";
res.innerHTML=`<h2>❌ UNHEALTHY FOOD</h2><p>Confidence: ${conf}%</p>`;
}

for(let i=0;i<prediction.length;i++){
let p=(prediction[i].probability*100).toFixed(1);
labelContainer.childNodes[i].innerHTML=`
<p><b>${prediction[i].className}</b> - ${p}%</p>
<div class="bar">
<div class="fill" style="width:${p}%;background:${prediction[i].className.toLowerCase().includes('healthy')?'#22c55e':'#ef4444'}"></div>
</div>`;
}
}
</script>

</body>
</html>
